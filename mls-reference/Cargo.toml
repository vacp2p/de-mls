[package]
name = "mls-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The MLS group-operations contract an application implements behind de-mls, plus an OpenMLS-backed reference implementation and a conformance suite"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
openmls = "0.8.1"
openmls_traits = "0.5.0"

sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
openmls_basic_credential = { version = "0.5.0", features = ["clonable"] }
openmls_rust_crypto = "0.5.1"
