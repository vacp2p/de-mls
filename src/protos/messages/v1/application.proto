// src/protos/messages/v1/application.proto

syntax = "proto3";

package de_mls.messages.v1;

import "hashgraph-like-consensus/v1/consensus.proto";

// Everything de-mls itself puts on the wire, sealed by the router at the
// current epoch. Chat content is not here: it is the application's.
message ControlMessage {
  oneof payload {
    consensus.v1.Proposal proposal = 1;
    consensus.v1.Vote vote = 2;
    ConversationSync conversation_sync = 3;
    ConversationSyncRequest conversation_sync_request = 4;
  }
}

message ConversationUpdateRequest {
  oneof payload {
    MemberInvite member_invite = 1;
    RemoveMember remove_member = 2;
    EmergencyCriteriaProposal emergency_criteria = 3;
    StewardElectionProposal steward_election = 4;
  }
}

message StewardElectionProposal {
  repeated bytes proposed_stewards = 1;
  uint64 election_epoch = 2;
  // Retry round within the same MLS epoch. Rotates the deterministic list
  // generation so a rejected election can be re-attempted with a different
  // composition without advancing the MLS epoch.
  uint32 retry_round = 3;
}

enum ViolationType {
  VIOLATION_UNSPECIFIED = 0;
  BROKEN_COMMIT = 1;        // Commit doesn't match voted proposals
  BROKEN_MLS_PROPOSAL = 2;  // MLS proposal doesn't match voting proposal
  CENSORSHIP_INACTIVITY = 3; // Steward didn't commit within threshold_duration
  SCORE_BELOW_THRESHOLD = 4; // Member's peer score dropped to/below removal threshold
  DEADLOCK = 5;              // Approved work is stuck; on YES the current epoch steward is skipped
  MISBEHAVING_COMMIT = 6;    // Wrongdoing that isn't a broken commit/proposal (e.g. committer not on the steward list);
}

message ViolationEvidence {
  ViolationType violation_type = 1;
  bytes target_member_id = 2;       // Malicious steward
  bytes evidence_payload = 3;       // Proof (mismatched hashes, timestamps, etc.)
  uint64 epoch = 4;                 // Epoch where violation occurred
  bytes creator_member_id = 5;      // Creator's member_id for scoring
}

message EmergencyCriteriaProposal {
  ViolationEvidence evidence = 1;
}

message MemberInvite {
  bytes key_package_bytes = 1;
  // The joiner's member id (its leaf signature key), as the proposer read it
  // from the key package. Every member checks it against the key package
  // before voting.
  bytes member_id = 2;
}

message RemoveMember {
  bytes member_id = 1;
}

message ConversationSync {
  repeated bytes steward_members = 1;
  uint64 election_epoch = 2;
  uint32 sn_min = 3;
  uint32 sn_max = 4;
  repeated PeerScore peer_scores = 5;
  TimingConfig timing = 6;
  // Seed for the deterministic steward-list sort; joiners reproduce the
  // ordering when validating.
  uint32 retry_round = 7;
  // Auto-vote default and consensus tie-break rule
  // (RFC §Creating Voting Proposal).
  bool liveness_criteria_yes = 8;
  // Candidate-basis delta: the members excluded from the steward computation at
  // `election_epoch` (not yet settled then). A joiner reconstructs the pool as
  // `MLS members \ unsettled_members` and re-derives the deterministic list to
  // verify `steward_members` instead of trusting it.
  repeated bytes unsettled_members = 9;
  // Score a new member starts at (RFC §Peer Scoring `default_peer_score`).
  int64 default_peer_score = 10;
}

// A member that joined without a bootstrap asks a steward to re-send the
// ConversationSync. Carries no fields: MLS decryption scopes it to this
// conversation and the authenticated sender identifies the requester.
message ConversationSyncRequest {}

message PeerScore {
  bytes member_id = 1;
  int64 score = 2;
}

message TimingConfig {
  uint64 commit_batch_window_ms = 1; // RFC §Inactivity Timer #1
  uint64 freeze_duration_ms = 2;
  uint64 proposal_expiration_ms = 3;
  uint64 consensus_timeout_ms = 4;
  uint64 backup_takeover_window_ms = 5; // RFC §Inactivity Timer #3 (backup answers a sync request)
}
