[workspace]
members = [".", "mls-reference"]
resolver = "3"

[package]
name = "de-mls"
version = "5.0.0"
edition = "2024"
rust-version = "1.95"
description = "Decentralized MLS policy engine — proposal voting, steward election and commit selection, recovery, and peer scoring for a group the application owns"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vacp2p/de-mls"
homepage = "https://github.com/vacp2p/de-mls"
documentation = "https://docs.rs/de-mls"
readme = "README.md"
keywords = ["mls", "decentralized", "consensus", "group-messaging"]
categories = ["cryptography", "network-programming"]
exclude = ["tests/", ".github/"]

[dependencies]
sha2 = "0.11.0"
thiserror = "2.0.18"
uuid = "1.23.2"
tracing = "0.1.44"
indexmap = "2.14.0"
prost = "0.14"

hashgraph-like-consensus = "0.6.0"

[build-dependencies]
prost-build = "0.14"
